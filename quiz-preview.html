<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2級建築施工管理 過去問演習</title>
<style>
body{margin:0;background:#f4f6f8;color:#172431;font:16px/1.6 system-ui,sans-serif}main{max-width:750px;margin:auto;padding:22px}h1{font-size:1.5rem}section{background:white;border:1px solid #dce3e8;border-radius:14px;padding:20px;margin:15px 0}button,a.link{font:inherit;border-radius:9px;padding:12px 16px;cursor:pointer}button{border:1px solid #b7c4ce;background:white;color:#173b50}button:hover{background:#eef7fb}button.selected{background:#116c80;color:white;border-color:#116c80}button:disabled{opacity:.45;cursor:default}.answers{display:flex;gap:8px;flex-wrap:wrap}.answers button{min-width:52px}.primary{background:#116c80;color:white}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#546979;font-size:.9rem}.link{display:inline-block;background:#e6f3f7;color:#126379;font-weight:bold;text-decoration:none}#result{border-left:4px solid #197887;padding:10px 14px;background:#eef8fa;margin-top:16px}.good{color:#087844}.bad{color:#b82c3b}.nav{display:flex;gap:10px;flex-wrap:wrap}select{font:inherit;padding:8px}a{color:#126379}
</style></head><body><main>
<h1>2級建築施工管理 過去問演習（試作）</h1>
<p class="muted">50問の出題表から1問ずつ練習できます。問題文は試験実施機関のPDFでご確認ください。</p>
<section><div class="bar"><strong id="progress"></strong><label>問題 <select id="jump"></select></label></div><p id="source"></p><a class="link" id="pdf" href="#" target="_blank" rel="noopener">公式問題を開く ↗</a><p class="muted">PDFの該当ページを開きます（閲覧環境によっては先頭ページが表示されます）。</p></section>
<section><h2 style="font-size:1.1rem">解答を選択</h2><div class="answers" id="choices"></div><p><button class="primary" id="check">正誤を確認</button></p><div id="result" hidden></div></section>
<section><div class="nav"><button id="prev">← 前の問題</button><button id="next">次の問題 →</button><button id="summary">解答状況</button></div><p class="muted">選択・判定結果はこのブラウザに保存されます。試験形式の選択数の確認はありません。</p><div id="stats" hidden></div></section>
<p class="muted">正答は各試験当時のものです。法令問題は現行法との照合が未完了です。解説はNo.1のみ収録しています。</p>
</main><script>
const years=['7後','8前','6後','6前','8前','6後','7前','7前','6後','8前','6後','6後','6前','7後','8前','7後','8前','8前','6後','7前','6前','6後','7後','7前','6前','7後','6前','7後','6前','8前','7後','7後','7前','7前','7前','7後','7前','8前','7前','6前','6前','6後','6前','8前','6後','8前','7前','6後','6前','7後'];
const pages=[3, 3, 3, 4, 6, 6, 6, 7, 7, 7, 9, 10, 9, 9, 1, 10, 10, 12, 14, 14, 13, 16, 14, 15, 14, 15, 15, 1, 16, 16, 16, 17, 19, 19, 19, 18, 20, 20, 22, 20, 21, 25, 22, 22, 26, 23, 28, 27, 24, 24];
const keys=[3,3,3,4,4,1,1,3,1,4,1,1,1,3,3,3,1,2,1,1,3,3,4,1,2,3,1,2,4,3,4,1,3,2,2,3,2,5,1,5,2,4,3,4,3,3,1,2,1,1];
const urls={'6前':'https://www.fcip-shiken.jp/pdf/r06_2kgz_mondai.pdf','6後':'https://www.fcip-shiken.jp/pdf/r06_2kg_mondai.pdf','7前':'https://www.fcip-shiken.jp/pdf/r07_2kgz_mondai.pdf','7後':'https://www.fcip-shiken.jp/pdf/r07_2kg_mondai.pdf','8前':'https://www.fcip-shiken.jp/pdf/r08_2kgz_mondai.pdf'};
let i=0;let saved={};try{saved=JSON.parse(localStorage.getItem('exam-progress-v1')||'{}')}catch(e){saved={}}let choice=null;
const el=id=>document.getElementById(id);for(let n=1;n<=50;n++){let o=document.createElement('option');o.value=n-1;o.textContent=n;el('jump').appendChild(o)}
function show(){el('progress').textContent='No.'+(i+1)+' / 50';el('jump').value=i;el('source').textContent='出題元：令和'+years[i]+'の No.'+(i+1);el('pdf').href=urls[years[i]]+'#page='+pages[i];el('choices').replaceChildren();for(let n=1;n<=((i>=37&&i<=41)?5:4);n++){let b=document.createElement('button');b.textContent=n;b.className=choice===n?'selected':'';b.onclick=()=>{choice=n;show()};el('choices').appendChild(b)}el('prev').disabled=i===0;el('next').disabled=i===49;el('result').hidden=!(saved[i]?.checked&&saved[i]?.choice===choice);if(!el('result').hidden){let x=saved[i];const explanation=i===0?'照度は、照らされる面に入射する光束をその面積で割った量です。選択肢3は光が面から放射される量と説明しているため不適当です。1の建築化照明、2のタスク・アンビエント照明、4の光害の説明は適当です。':'解説は未収録です。公式問題・正答肢を確認してください。';el('result').innerHTML='<strong class="'+(x.choice===keys[i]?'good':'bad')+'">'+(x.choice===keys[i]?'正解':'不正解')+'</strong>　正答：'+keys[i]+'<p class="muted">'+explanation+'</p>'}el('stats').hidden=true}
function go(n){i=n;choice=saved[i]?.choice??null;show()}el('check').onclick=()=>{if(choice===null){alert('選択肢を選んでください。');return}saved[i]={choice,checked:true};try{localStorage.setItem('exam-progress-v1',JSON.stringify(saved))}catch(e){}show()};el('prev').onclick=()=>{if(i>0)go(i-1)};el('next').onclick=()=>{if(i<49)go(i+1)};el('jump').onchange=e=>go(Number(e.target.value));el('summary').onclick=()=>{const entries=Object.entries(saved).filter(([n,x])=>x.checked);const correct=entries.filter(([n,x])=>x.choice===keys[Number(n)]).length;el('stats').hidden=false;el('stats').textContent='判定済み：'+entries.length+'問　正解：'+correct+'問（選択問題を含む練習記録）'};go(0);
</script></body></html>
